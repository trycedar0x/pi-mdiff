<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, monospace">
  <!-- Background -->
  <rect width="1200" height="400" fill="#0d1117"/>

  <!-- Left panel: broken edit -->
  <rect x="40" y="40" width="520" height="320" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="74" fill="#8b949e" font-size="12">WITHOUT pi-mdiff</text>
  <rect x="40" y="82" width="520" height="1" fill="#30363d"/>

  <!-- error label -->
  <rect x="60" y="96" width="110" height="20" rx="4" fill="#3d1a1a"/>
  <text x="115" y="110" fill="#f85149" font-size="11" text-anchor="middle">✗ edit failed</text>

  <text x="60" y="140" fill="#8b949e" font-size="11">SEARCH block (from LLM):</text>
  <rect x="60" y="150" width="480" height="76" rx="6" fill="#111417"/>
  <text x="76" y="170" fill="#e6edf3" font-size="12">The system uses PostgreSQL</text>
  <text x="76" y="188" fill="#e6edf3" font-size="12">for all storage.</text>
  <text x="76" y="206" fill="#e6edf3" font-size="12">Migrations use Alembic.</text>

  <text x="60" y="252" fill="#8b949e" font-size="11">File on disk (reflowed by formatter):</text>
  <rect x="60" y="262" width="480" height="52" rx="6" fill="#111417"/>
  <text x="76" y="282" fill="#e6edf3" font-size="12">The system uses PostgreSQL for all storage. Migrations use Alembic.</text>

  <rect x="60" y="330" width="480" height="20" rx="4" fill="#3d1a1a"/>
  <text x="300" y="344" fill="#f85149" font-size="11" text-anchor="middle">Error: cannot find matching context</text>

  <!-- Arrow -->
  <text x="596" y="208" fill="#8b949e" font-size="28" text-anchor="middle">→</text>

  <!-- Right panel: fixed -->
  <rect x="640" y="40" width="520" height="320" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="660" y="74" fill="#8b949e" font-size="12">WITH pi-mdiff</text>
  <rect x="640" y="82" width="520" height="1" fill="#30363d"/>

  <!-- success label -->
  <rect x="660" y="96" width="110" height="20" rx="4" fill="#1a3d1a"/>
  <text x="715" y="110" fill="#3fb950" font-size="11" text-anchor="middle">✓ edit applied</text>

  <text x="660" y="140" fill="#8b949e" font-size="11">Normalizes SEARCH before matching:</text>
  <rect x="660" y="150" width="480" height="76" rx="6" fill="#111417"/>
  <text x="676" y="170" fill="#8b949e" font-size="12" font-style="italic">→ joins soft-wrapped lines</text>
  <text x="676" y="190" fill="#e6edf3" font-size="12">The system uses PostgreSQL for all storage.</text>
  <text x="676" y="210" fill="#e6edf3" font-size="12">Migrations use Alembic.</text>

  <text x="660" y="252" fill="#8b949e" font-size="11">Matches file on disk:</text>
  <rect x="660" y="262" width="480" height="52" rx="6" fill="#111417"/>
  <text x="676" y="282" fill="#e6edf3" font-size="12">The system uses PostgreSQL for all storage. Migrations use Alembic.</text>

  <rect x="660" y="330" width="480" height="20" rx="4" fill="#1a3d1a"/>
  <text x="900" y="344" fill="#3fb950" font-size="11" text-anchor="middle">Edit applied. No retries. No errors.</text>

  <!-- Title bottom -->
  <text x="600" y="390" fill="#6e7681" font-size="13" text-anchor="middle">pi-mdiff — markdown-aware editing for pi coding agent · pi install npm:pi-mdiff</text>
</svg>